name: Scoped evaluation and tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and localhost integration tests
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          all_proxy: http://127.0.0.1:9
          NO_PROXY: ''
          no_proxy: ''
        run: python -m unittest discover -s tests -v
      - name: Reproduce scoped baseline artifacts
        run: python scripts/check_evaluation.py
      - name: Generation contract fixtures (no model inference or quality score)
        run: python scripts/check_generation_contract.py
      - name: Agent workflow contract fixtures (no live agent quality score)
        run: python scripts/check_agent_contract.py
      - name: Static frontend integrity and syntax (not a browser test)
        run: python scripts/check_frontend.py
      - name: Controlled-delay frontend job state tests (not rendering)
        run: node scripts/check_agent_ui.js
      - name: Synthetic serving artifact (no model performance claim)
        run: python scripts/check_serving_fixture.py
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned official scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/gitleaks/archive.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks/archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks/archive.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Redacted history, tracked snapshot and generated dummy control
        run: python3 scripts/check_secrets.py --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks"
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
      - name: Install exact locked test dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install matching Chromium only in disposable runner
        run: npx --no-install playwright install --with-deps chromium
      - name: Offline browser smoke and mobile layouts
        run: npm run test:browser
