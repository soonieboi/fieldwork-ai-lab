name: Scoped evaluation and tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and localhost integration tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce scoped baseline artifacts
        run: python scripts/check_evaluation.py
      - name: Generation contract fixtures (no model inference or quality score)
        run: python scripts/check_generation_contract.py
      - name: Agent workflow contract fixtures (no live agent quality score)
        run: python scripts/check_agent_contract.py
      - name: Static frontend integrity and syntax (not a browser test)
        run: python scripts/check_frontend.py
      - name: Controlled-delay frontend job state tests (not rendering)
        run: node scripts/check_agent_ui.js
      - name: Synthetic serving artifact (no model performance claim)
        run: python scripts/check_serving_fixture.py
